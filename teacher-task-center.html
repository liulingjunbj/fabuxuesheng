function icons(){if(window.lucide)window.lucide.createIcons()}function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1600)}function safe(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}function activityMarkup(item,index=0){return `<div class="activity"><span class="avatar${index%2?' blue':''}">${item.student[0]}</span><div class="activity-main"><b>${item.student}</b> ${item.action}<small>${item.task}${item.detail?' · '+item.detail:''}</small></div><time>${item.time}</time></div>`}function recordMarkup(item){return `<div class="record"><span class="record-dot"><i data-lucide="${item.icon}"></i></span><div class="record-copy"><b>${item.student}</b> ${item.action}<small>${item.task}${item.detail?' · '+item.detail:''} · ${item.time}</small></div></div>`}function showView(name){$$('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+name));$$('.nav-btn').forEach(el=>el.classList.toggle('active',el.dataset.view===name));history.replaceState(null,'','#'+name);window.scrollTo({top:0,behavior:'smooth'});icons()}function openDrawer(kind,id){const isStudent=kind==='student',subject=isStudent?students.find(x=>x.id===id):tasks.find(x=>x.id===id);if(!subject)return;const records=activities.filter(x=>isStudent?x.sid===id:x.tid===id);$('#drawerKicker').textContent=isStudent?'学生记录':'任务记录';$('#drawerTitle').textContent=subject.name;$('#drawerSub').textContent=isStudent?(subject.klass+' · 学号 '+subject.no):subject.meta+' · '+subject.method+' · '+(subject.submit?'可提交':'仅打开');$('#recordTitle').textContent=subject.submit||isStudent?'打开与提交':'打开记录';$('#timeline').innerHTML=records.length?records.map(recordMarkup).join(''):'<div class="modal-copy">暂无记录</div>';$('#drawerVeil').classList.add('show');icons()}
function renderStudents(query=''){const keyword=query.trim().toLowerCase(),visible=students.filter(s=>!keyword||s.name.toLowerCase().includes(keyword)||s.no.toLowerCase().includes(keyword));$('#studentTotal').textContent=studentTotal;$('#studentRows').innerHTML=visible.length?visible.map((s,index)=>`<tr><td><span class="student-no">${safe(s.no)}</span></td><td><span class="person"><span class="avatar${index%2?' blue':''}">${safe(s.initial)}</span><span><b>${safe(s.name)}</b></span></span></td><td><span class="tag">${safe(s.klass)}</span></td><td>${safe(s.last)}</td><td><span class="row-actions"><button class="row-btn" data-student="${s.id}">查看</button><button class="row-btn" data-edit-student="${s.id}">更新</button><button class="row-btn danger" data-delete-student="${s.id}">删除</button></span></td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#8b968f">未找到学生</td></tr>';icons()}
function closeModal(){$('#modalVeil').classList.remove('show');editingStudentId=null}function showModal(html){$('#modalPanel').innerHTML=html;$('#modalVeil').classList.add('show');icons()}function modalTop(title){return `<div class="modal-top"><h2>${title}</h2><button class="modal-x" data-modal-close><i data-lucide="x"></i></button></div>`}function openRosterWarning(){showModal(`${modalTop('温馨提示')}<p class="modal-copy">更新后将以新名单为准（旧名单清空）。若新旧名单的学号一致，其打开、提交记录将自动关联。</p><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn dark" data-roster-next>我知道了，去更新</button></div>`)}function openRosterUpload(){showModal(`${modalTop('更新学生名单')}<div class="upload-box"><i data-lucide="sheet"></i><b id="rosterFileName">六年级3班学生名单.xlsx</b><small>支持 XLSX、XLS、CSV，必须包含学号和姓名</small><input id="rosterFile" type="file" accept=".xlsx,.xls,.csv" hidden><button class="btn" style="margin:auto" data-pick-roster><i data-lucide="upload"></i>选择名单文件</button></div><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn dark" data-roster-apply>确认更新</button></div>`)}function openStudentForm(id=null){editingStudentId=id;const student=id?students.find(s=>s.id===id):{no:'',name:'',klass:'六年级（3）班'};showModal(`${modalTop(id?'更新学生':'添加学生')}<label class="field-label">学号</label><input class="field" id="studentNo" value="${safe(student.no)}" placeholder="例如 20260305"><label class="field-label">姓名</label><input class="field" id="studentName" value="${safe(student.name)}" placeholder="请输入学生姓名"><label class="field-label">班级</label><input class="field" id="studentClass" value="${safe(student.klass)}"><div class="modal-actions" style="margin-top:24px"><button class="btn" data-modal-close>取消</button><button class="btn dark" data-save-student>${id?'保存更新':'确认添加'}</button></div>`)}function openDeleteStudent(id){editingStudentId=id;const student=students.find(s=>s.id===id);showModal(`${modalTop('删除学生')}<div class="danger-copy">确定从当前名单中删除「${safe(student.name)}」（学号 ${safe(student.no)}）吗？学生已有的打开、提交记录不会随名单删除。</div><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn dark" data-confirm-delete>确认删除</button></div>`)}
renderStudents();$('#taskRows').innerHTML=tasks.map(t=>`<article class="task-row"><span class="type ${t.tone}">${t.type}</span><div><div class="task-title">${t.name} <span class="mode-pill ${t.submit?'submit':''}">${t.submit?'可提交':'仅打开'}</span></div><div class="task-meta">${t.meta} · ${t.date}</div></div><div class="task-datum"><b>${t.target}</b></div><div class="task-datum"><b>${t.method}</b></div><button class="link-btn" data-task="${t.id}">查看记录 <i data-lucide="arrow-right"></i></button></article>`).join('');$$('[data-view]').forEach(btn=>btn.addEventListener('click',()=>showView(btn.dataset.view)));$('#studentSearch').addEventListener('input',event=>renderStudents(event.target.value));$('#updateRoster').addEventListener('click',openRosterWarning);$('#addStudent').addEventListener('click',()=>openStudentForm());document.addEventListener('click',event=>{const student=event.target.closest('[data-student]'),task=event.target.closest('[data-task]'),edit=event.target.closest('[data-edit-student]'),remove=event.target.closest('[data-delete-student]');if(student)openDrawer('student',student.dataset.student);if(task)openDrawer('task',task.dataset.task);if(edit)openStudentForm(edit.dataset.editStudent);if(remove)openDeleteStudent(remove.dataset.deleteStudent);if(event.target.closest('[data-modal-close]'))closeModal();if(event.target.closest('[data-roster-next]'))openRosterUpload();if(event.target.closest('[data-pick-roster]'))$('#rosterFile').click();if(event.target.closest('[data-roster-apply]')){const additions=[{id:'zhou',no:'20260305',name:'周雨桐',initial:'周',klass:'六年级（3）班',last:'暂无任务动态'},{id:'wang',no:'20260306',name:'王浩然',initial:'王',klass:'六年级（3）班',last:'暂无任务动态'}];additions.forEach(item=>{if(!students.some(s=>s.no===item.no))students.push(item)});studentTotal=26;renderStudents($('#studentSearch').value);closeModal();toast('名单更新成功，共 26 名学生')}if(event.target.closest('[data-save-student]')){const no=$('#studentNo').value.trim(),name=$('#studentName').value.trim(),klass=$('#studentClass').value.trim();if(!no||!name){toast('请填写学号和姓名');return}if(editingStudentId){const current=students.find(s=>s.id===editingStudentId);Object.assign(current,{no,name,klass,initial:name[0]});toast('学生信息已更新')}else{students.push({id:'student-'+Date.now(),no,name,klass,initial:name[0],last:'暂无任务动态'});studentTotal+=1;toast('学生已添加')}renderStudents($('#studentSearch').value);closeModal()}if(event.target.closest('[data-confirm-delete]')){students=students.filter(s=>s.id!==editingStudentId);studentTotal=Math.max(0,studentTotal-1);renderStudents($('#studentSearch').value);closeModal();toast('学生已从名单删除')}});$('#modalPanel').addEventListener('change',event=>{if(event.target.id==='rosterFile'&&event.target.files[0])$('#rosterFileName').textContent=event.target.files[0].name});$('#drawerClose').addEventListener('click',()=>$('#drawerVeil').classList.remove('show'));$('#drawerVeil').addEventListener('click',event=>{if(event.target===$('#drawerVeil'))$('#drawerVeil').classList.remove('show')});$('#modalVeil').addEventListener('click',event=>{if(event.target===$('#modalVeil'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('#drawerVeil').classList.remove('show');closeModal()}});const initial=location.hash.slice(1);if(['students','tasks'].includes(initial))showView(initial);icons();
</script>
