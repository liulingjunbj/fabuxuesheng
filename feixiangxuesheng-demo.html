ize:9px;color:#2d6d42;font-weight:800}.search{margin-left:auto;width:220px;height:35px;border:1px solid #dfe6e2;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#9aa49e;font-size:9px}.tasks{padding:0 20px}.task{display:grid;grid-template-columns:48px minmax(0,1fr) 105px;gap:13px;align-items:center;min-height:88px;border-bottom:1px solid #e9eeeb}.task:last-child{border-bottom:0}.type{width:43px;height:43px;border-radius:11px;display:grid;place-items:center;background:#e5f6ea;color:#347248;font-size:9px;font-weight:900}.type.doc{background:#e9efff;color:#4b70ca}.type.pdf{background:#ffe8eb;color:#df4d63}.type.xls{background:#e5f4ff;color:#2776cf}.task-name{font-size:11px;font-weight:800}.task-meta{font-size:8px;color:#8a958f;margin-top:5px}.go{height:35px;border:1px solid #d6e1da;border-radius:9px;background:#fff;font-size:9px;font-weight:800}.go.strong{background:var(--deep);color:#fff;border-color:var(--deep)}.modal{position:fixed;inset:0;background:rgba(13,29,22,.54);backdrop-filter:blur(7px);display:none;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.dialog{width:min(470px,94vw);border-radius:21px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.27);overflow:hidden}.dialog-head{height:58px;display:flex;align-items:center;padding:0 19px;border-bottom:1px solid var(--line);font-size:11px;font-weight:850}.dialog-head button{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:transparent}.dialog-body{padding:27px}.dialog-body h2{font-size:23px;margin:0 0 8px}.lead{font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:18px}.field{width:100%;height:48px;border:1px solid #dbe4df;border-radius:10px;padding:0 13px;outline:0;margin-bottom:10px}.full{width:100%;height:47px;margin-top:3px}.task-found{border:1px solid #dce7df;border-radius:14px;background:#f5faf6;padding:15px;margin-bottom:16px}.task-found small{color:#3b7650;font-size:8px;font-weight:800}.task-found h3{font-size:14px;mar <body>
<div class="site" id="site">
  <header class="top"><a class="brand" href="feixiangxuesheng-demo.html"><span class="mark">FX</span><span>飞象学生<div class="domain">feixiangxuesheng.com</div></span></a><span class="login-button"><i data-lucide="link"></i>临时任务入口</span></header>
  <main class="landing"><section class="hero"><div class="eyebrow"><i data-lucide="graduation-cap"></i>无需注册</div><h1>领取老师发布的任务</h1><p class="hero-copy">输入老师发来的作业码，填写姓名或学号即可进入本次任务。</p><div class="claim-box"><div class="claim-label">输入 6 位作业码</div><div class="code-row"><input class="code-input" id="code" maxlength="6" inputmode="numeric" value="482916"><button class="primary" id="findTask">查找任务</button></div><div class="claim-note"><i data-lucide="shield-check"></i><b>单次领取</b> · 不注册账号，不生成任务列表</div><div class="route-strip"><div class="route"><i>① 输入作业码</i><span>老师会把号码或二维码发给你</span></div><div class="route"><i>② 自报身份</i><span>填写姓名或学号即可</span></div><div class="route"><i>③ 去完成</i><span>应用打开网址，文件直接下载</span></div></div></div></section></main>
</div>
<div class="modal" id="claimModal"><section class="dialog"><header class="dialog-head">临时任务<button data-close><i data-lucide="x"></i></button></header><div class="dialog-body"><div class="task-found"><small>已找到任务 · 在线应用</small><h3>同分异构体 · 碳链异构 3D 互动教学</h3><p>化学老师发布 · 点击后打开在线应用</p></div><h2>告诉老师你是谁</h2><div class="lead">姓名和学号填写一项即可。本次信息只用于这项任务。</div><input class="field" id="guestName" value="小明" placeholder="姓名（选填）"><input class="field" id="guestNo" placeholder="学号（选填）"><button class="primary full" id="claim">去完成</button><div class="message" id="message"></div></div></section></div>
<div class="toast" id="toast"></div>
<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const APP_TASK_URL='https://www.feixianglaoshi.com/#/chat?share=1&chatShareId=&communityContentId=67CFE25E9EBAD75EFCEAF1D94A595EE4&featureId=20&watermarkTheme=main';let toastTimer;function icons(){if(window.lucide)lucide.createIcons()}function showModal(id){$(id).classList.add('show');icons()}function hideModals(){$$('.modal').forEach(el=>el.classList.remove('show'))}function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1700)}
  $('#findTask').addEventListener('click',()=>{/^\d{6}$/.test($('#code').value.trim())?showModal('#claimModal'):toast('请输入正确的 6 位作业码')});$('#claim').addEventListener('click',()=>{const identity=$('#guestName').value.trim()||$('#guestNo').value.trim();if(!identity){$('#message').textContent='请填写姓名或学号';return}window.open(APP_TASK_URL,'_blank','noopener,noreferrer');toast('正在打开任务')});$$('[data-close]').forEach(btn=>btn.addEventListener('click',hideModals));icons();
</script>
