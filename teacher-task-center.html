<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生与任务 · 飞象老师</title>
<script src="assets/lucide-loader.js"></script>
<style>
:root{--ink:#14241d;--muted:#748078;--line:#e3e9e5;--green:#225b42;--green-soft:#e7f3eb;--blue:#3e67d7;--blue-soft:#edf2ff;--amber:#ae6f16;--amber-soft:#fff5df;--shadow:0 24px 70px rgba(34,60,47,.12);--sans:"Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:var(--sans);color:var(--ink);background:linear-gradient(140deg,#eef5f0 0,#f8faf8 44%,#f1f4fa 100%);-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}[data-lucide]{width:18px;height:18px;stroke-width:1.8}.shell{min-height:100vh}.topbar{height:74px;padding:0 34px;display:flex;align-items:center;border-bottom:1px solid rgba(213,224,217,.85);background:rgba(255,255,255,.82);backdrop-filter:blur(16px);position:sticky;top:0;z-index:8}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:780}.brand-mark{width:35px;height:35px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:-.08em}.crumb{margin-left:23px;padding-left:23px;border-left:1px solid var(--line);color:#556159;font-size:13px}.class-select{margin-left:auto;height:40px;border:1px solid #ccd8d0;border-radius:12px;background:#fff;padding:0 13px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:650}.back-index{height:40px;margin-left:9px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;gap:7px;font-size:11px;color:#647168}.workspace{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:44px 0 70px}.nav{display:flex;gap:5px;margin-bottom:34px}.nav-btn{height:38px;border:0;border-radius:10px;background:transparent;padding:0 14px;color:#68736c;font-size:12px;font-weight:650;display:flex;align-items:center;gap:7px}.nav-btn.active{background:#fff;color:var(--green);box-shadow:0 8px 25px rgba(41,67,53,.08)}.view{display:none;animation:enter .24s ease both}.view.active{display:block}@keyframes enter{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:34px;letter-spacing:-.04em;margin:8px 0}.hero p{margin:0;color:var(--muted);font-size:13px}.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0}.portal{min-height:174px;border:1px solid rgba(215,225,218,.95);border-radius:20px;background:rgba(255,255,255,.9);padding:25px;display:grid;grid-template-columns:58px 1fr auto;gap:18px;align-items:center;text-align:left;box-shadow:0 14px 44px rgba(43,66,53,.07);transition:.2s}.portal:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#bdd2c4}.portal-icon{width:58px;height:58px;border-radius:17px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}.portal-icon [data-lucide]{width:27px;height:27px}.portal:nth-child(2) .portal-icon{background:var(--amber-soft);color:var(--amber)}.portal-kicker{font-size:10px;color:var(--muted)}.portal h2{margin:5px 0 7px;font-size:20px}.portal p{margin:0;color:var(--muted);font-size:11px}.portal-count{text-align:right}.portal-count b{display:block;font-size:25px}.portal-count small{color:var(--muted);font-size:9px}.portal-arrow{margin-top:18px;width:34px;height:34px;border-radius:50%;background:#f0f4f1;display:grid;place-items:center;margin-left:auto}.section-card{background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 16px 48px rgba(35,56,44,.06)}.section-head{min-height:70px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.section-head h2{font-size:16px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:10px}.activity-list{padding:4px 22px}.activity{min-height:72px;display:grid;grid-template-columns:40px 1fr auto;gap:13px;align-items:center;border-bottom:1px solid #edf0ee}.activity:last-child{border:0}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e7f1ea;color:var(--green);font-size:12px;font-weight:750}.avatar.blue{background:var(--blue-soft);color:var(--blue)}.activity-main{font-size:12px}.activity-main b{font-weight:750}.activity-main small{display:block;color:var(--muted);margin-top:5px;font-size:9.5px}.activity time{color:#9aa39d;font-size:9.5px}.page-head{display:flex;align-items:flex-end;margin-bottom:20px}.page-head h1{font-size:27px;margin:5px 0 0}.page-head p{margin:6px 0 0;color:var(--muted);font-size:11px}.page-actions{margin-left:auto;display:flex;gap:8px}.btn{height:39px;padding:0 14px;border:1px solid #d3dcd6;border-radius:10px;background:#fff;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.toolbar{height:66px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.search{width:290px;height:38px;border:1px solid var(--line);border-radius:10px;background:#f8faf8;display:flex;align-items:center;gap:8px;padding:0 11px;color:#98a19b;font-size:10.5px}.search input{border:0;outline:0;background:transparent;flex:1}.subtle-count{margin-left:auto;color:#909991;font-size:10px}.table{width:100%;border-collapse:collapse}.table th{height:45px;text-align:left;padding:0 20px;color:#939c96;font-size:9px;font-weight:600;background:#fbfcfb}.table td{height:70px;padding:0 20px;border-top:1px solid #edf0ee;font-size:11px}.person{display:flex;align-items:center;gap:10px}.person b{font-size:12px}.person small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.tag{display:inline-flex;padding:5px 8px;border-radius:7px;background:#f0f3f1;color:#657169;font-size:9px}.link-btn{border:0;background:transparent;color:var(--green);font-size:10px;font-weight:750;display:flex;align-items:center;gap:5px}.task-list{padding:0 20px}.task-row{min-height:88px;display:grid;grid-template-columns:48px 1fr 150px 130px 95px;gap:16px;align-items:center;border-bottom:1px solid #edf0ee}.task-row:last-child{border:0}.type{width:44px;height:44px;border-radius:13px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:9px;font-weight:800}.type.file{background:var(--blue-soft);color:var(--blue)}.type.ink{background:var(--amber-soft);color:var(--amber)}.task-title{font-size:12px;font-weight:750}.task-meta{font-size:9.5px;color:var(--muted);margin-top:5px}.task-datum b{display:block;font-size:10.5px}.task-datum small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.drawer-veil{position:fixed;inset:0;background:rgba(18,31,25,.28);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:.2s}.drawer-veil.show{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;height:100%;width:min(520px,92vw);background:#fff;box-shadow:-24px 0 70px rgba(23,45,34,.16);transform:translateX(100%);transition:.28s ease;display:grid;grid-template-rows:auto 1fr}.drawer-veil.show .drawer{transform:none}.drawer-head{padding:27px 28px 22px;border-bottom:1px solid var(--line)}.drawer-top{display:flex;align-items:center}.drawer-kicker{font-size:9px;color:var(--green);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.drawer-close{margin-left:auto;width:35px;height:35px;border:0;border-radius:10px;background:#f2f5f3;display:grid;place-items:center}.drawer h2{font-size:23px;margin:9px 0 7px;letter-spacing:-.03em}.drawer-sub{color:var(--muted);font-size:10.5px}.drawer-body{padding:22px 28px;overflow:auto}.record-title{font-size:11px;font-weight:750;margin:0 0 10px}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:17px;top:17px;bottom:17px;width:1px;background:#dfe6e1}.record{position:relative;display:grid;grid-template-columns:35px 1fr;gap:13px;padding:11px 0}.record-dot{width:35px;height:35px;border-radius:12px;background:#edf4ef;color:var(--green);display:grid;place-items:center;z-index:1}.record-copy{padding-top:2px;font-size:11px;line-height:1.55}.record-copy b{font-weight:760}.record-copy small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:#17241e;color:#fff;border-radius:11px;padding:11px 16px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.topbar{padding:0 18px}.crumb,.back-index{display:none}.workspace{width:calc(100% - 28px);padding-top:28px}.portal-grid{grid-template-columns:1fr}.task-row{grid-template-columns:45px 1fr 88px}.task-datum:nth-of-type(2){display:none}.task-row .link-btn{justify-self:end}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">FX</span>飞象老师</a><span class="crumb">学生与任务</span><button class="class-select"><i data-lucide="users"></i>六年级（3）班<i data-lucide="chevron-down"></i></button><a class="back-index" href="index.html"><i data-lucide="layout-grid"></i>Demo 总入口</a></header><main class="workspace">
<nav class="nav"><button class="nav-btn active" data-view="home"><i data-lucide="house"></i>概览</button><button class="nav-btn" data-view="students"><i data-lucide="contact-round"></i>学生名单</button><button class="nav-btn" data-view="tasks"><i data-lucide="send"></i>我布置的任务</button></nav>
<section class="view active" id="view-home"><header class="hero"><div class="eyebrow">Students & assignments</div><h1>学生与任务</h1><p>管理班级名单，查看自己布置的任务，以及学生在任务中做过什么。</p></header><div class="portal-grid"><button class="portal" data-view="students"><span class="portal-icon"><i data-lucide="contact-round"></i></span><span><span class="portal-kicker">班级基础信息</span><h2>学生名单</h2><p>添加、导入学生，并查看个人任务动态</p></span><span class="portal-count"><b>24</b><small>名学生</small><span class="portal-arrow"><i data-lucide="arrow-right"></i></span></span></button><button class="portal" data-view="tasks"><span class="portal-icon"><i data-lucide="send"></i></span><span><span class="portal-kicker">发布记录</span><h2>我布置的任务</h2><p>找到已发布内容，查看学生行为记录</p></span><span class="portal-count"><b>4</b><small>个任务</small><span class="portal-arrow"><i data-lucide="arrow-right"></i></span></span></button></div><section class="section-card"><header class="section-head"><div><h2>最近动态</h2><p>按发生时间排列，不判断是否完成</p></div></header><div class="activity-list" id="recentList"></div></section></section>
<section class="view" id="view-students"><header class="page-head"><div><div class="eyebrow">Student list</div><h1>学生名单</h1><p>六年级（3）班 · 点击学生查看他在不同任务中的行为记录</p></div><div class="page-actions"><button class="btn" data-demo="已选择名单文件"><i data-lucide="file-up"></i>导入名单</button><button class="btn primary" data-demo="已打开添加学生表单"><i data-lucide="user-plus"></i>添加学生</button></div></header><section class="section-card"><div class="toolbar"><label class="search"><i data-lucide="search"></i><input placeholder="搜索学生姓名"></label><span class="subtle-count">共 24 名学生</span></div><table class="table"><thead><tr><th>学生</th><th>班级</th><th>最近一次动作</th><th>操作</th></tr></thead><tbody id="studentRows"></tbody></table></section></section>
<section class="view" id="view-tasks"><header class="page-head"><div><div class="eyebrow">Published tasks</div><h1>我布置的任务</h1><p>只记录发布信息与学生行为，不计算完成率</p></div></header><section class="section-card"><div class="toolbar"><label class="search"><i data-lucide="search"></i><input placeholder="搜索任务名称"></label><span class="subtle-count">共 4 个任务</span></div><div class="task-list" id="taskRows"></div></section></section>
</main></div>
<div class="drawer-veil" id="drawerVeil"><aside class="drawer"><header class="drawer-head"><div class="drawer-top"><span class="drawer-kicker" id="drawerKicker">Activity</span><button class="drawer-close" id="drawerClose"><i data-lucide="x"></i></button></div><h2 id="drawerTitle">任务动态</h2><div class="drawer-sub" id="drawerSub"></div></header><main class="drawer-body"><h3 class="record-title" id="recordTitle">行为记录</h3><div class="timeline" id="timeline"></div></main></aside></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let toastTimer;
const students=[{id:'lin',name:'林晓雨',initial:'林',klass:'六年级（3）班',last:'提交了答案 · 2 分钟前'},{id:'shi',name:'石霖',initial:'石',klass:'六年级（3）班',last:'下载了文件 · 8 分钟前'},{id:'zheng',name:'郑石宇',initial:'郑',klass:'六年级（3）班',last:'打开了任务 · 12 分钟前'},{id:'chen',name:'陈思源',initial:'陈',klass:'六年级（3）班',last:'领取了任务 · 昨天 18:22'}];
const tasks=[{id:'chem',type:'HTML',tone:'',name:'同分异构体 · 碳链异构 3D 互动教学',meta:'在线应用 · 化学',target:'六年级（3）班',method:'作业码领取',date:'今天 09:00'},{id:'math',type:'PDF',tone:'file',name:'一年级数学章节巩固练习',meta:'PDF 文件 · 数学',target:'未指定学生',method:'公开领取',date:'昨天 18:00'},{id:'english',type:'DOC',tone:'file',name:'20.1 勾股定理及其应用 练习3',meta:'DOCX 文件 · 数学',target:'12 位学生',method:'学习机推送',date:'9 月 12 日'},{id:'ink',type:'XLS',tone:'ink',name:'英语单词学习记录表',meta:'XLSX 文件 · 英语',target:'六年级（3）班',method:'墨水屏推送',date:'9 月 8 日'}];
const activities=[{student:'林晓雨',sid:'lin',task:'同分异构体 · 碳链异构 3D 互动教学',tid:'chem',action:'提交了答案',detail:'第 3 题 · 选择 B',time:'2 分钟前',icon:'send'},{student:'石霖',sid:'shi',task:'一年级数学章节巩固练习',tid:'math',action:'下载了文件',detail:'PDF 原文件',time:'8 分钟前',icon:'download'},{student:'郑石宇',sid:'zheng',task:'同分异构体 · 碳链异构 3D 互动教学',tid:'chem',action:'打开了任务',detail:'通过作业码进入',time:'12 分钟前',icon:'external-link'},{student:'林晓雨',sid:'lin',task:'同分异构体 · 碳链异构 3D 互动教学',tid:'chem',action:'选择了「碳链异构」',detail:'应用内互动操作',time:'18 分钟前',icon:'mouse-pointer-click'},{student:'陈思源',sid:'chen',task:'20.1 勾股定理及其应用 练习3',tid:'english',action:'领取了任务',detail:'学习机推送',time:'昨天 18:22',icon:'inbox'}];
function icons(){if(window.lucide)window.lucide.createIcons()}function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1600)}function activityMarkup(item,index=0){return `<div class="activity"><span class="avatar${index%2?' blue':''}">${item.student[0]}</span><div class="activity-main"><b>${item.student}</b> ${item.action}<small>${item.task}${item.detail?' · '+item.detail:''}</small></div><time>${item.time}</time></div>`}function recordMarkup(item){return `<div class="record"><span class="record-dot"><i data-lucide="${item.icon}"></i></span><div class="record-copy"><b>${item.student}</b> ${item.action}<small>${item.task}${item.detail?' · '+item.detail:''} · ${item.time}</small></div></div>`}function showView(name){$$('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+name));$$('.nav-btn').forEach(el=>el.classList.toggle('active',el.dataset.view===name));history.replaceState(null,'','#'+name);window.scrollTo({top:0,behavior:'smooth'});icons()}function openDrawer(kind,id){const isStudent=kind==='student',subject=isStudent?students.find(x=>x.id===id):tasks.find(x=>x.id===id),records=activities.filter(x=>isStudent?x.sid===id:x.tid===id);$('#drawerKicker').textContent=isStudent?'Student activity':'Task activity';$('#drawerTitle').textContent=subject.name;$('#drawerSub').textContent=isStudent?(subject.klass+' · 该学生在不同任务中的行为'):subject.meta+' · '+subject.target+' · '+subject.method;$('#recordTitle').textContent=isStudent?'学生动态':'任务动态';$('#timeline').innerHTML=records.map(recordMarkup).join('');$('#drawerVeil').classList.add('show');icons()}
$('#recentList').innerHTML=activities.slice(0,4).map(activityMarkup).join('');$('#studentRows').innerHTML=students.map((s,index)=>`<tr><td><span class="person"><span class="avatar${index%2?' blue':''}">${s.initial}</span><span><b>${s.name}</b><small>学生</small></span></span></td><td><span class="tag">${s.klass}</span></td><td>${s.last}</td><td><button class="link-btn" data-student="${s.id}">查看动态 <i data-lucide="arrow-right"></i></button></td></tr>`).join('');$('#taskRows').innerHTML=tasks.map(t=>`<article class="task-row"><span class="type ${t.tone}">${t.type}</span><div><div class="task-title">${t.name}</div><div class="task-meta">${t.meta} · 发布于 ${t.date}</div></div><div class="task-datum"><b>${t.target}</b><small>发布对象</small></div><div class="task-datum"><b>${t.method}</b><small>领取方式</small></div><button class="link-btn" data-task="${t.id}">查看动态 <i data-lucide="arrow-right"></i></button></article>`).join('');$$('[data-view]').forEach(btn=>btn.addEventListener('click',()=>showView(btn.dataset.view)));document.addEventListener('click',event=>{const student=event.target.closest('[data-student]'),task=event.target.closest('[data-task]');if(student)openDrawer('student',student.dataset.student);if(task)openDrawer('task',task.dataset.task)});$$('[data-demo]').forEach(btn=>btn.addEventListener('click',()=>toast(btn.dataset.demo+'（演示）')));$('#drawerClose').addEventListener('click',()=>$('#drawerVeil').classList.remove('show'));$('#drawerVeil').addEventListener('click',event=>{if(event.target===$('#drawerVeil'))$('#drawerVeil').classList.remove('show')});document.addEventListener('keydown',event=>{if(event.key==='Escape')$('#drawerVeil').classList.remove('show')});const initial=location.hash.slice(1);if(['students','tasks'].includes(initial))showView(initial);icons();
</script>
</body>
</html>
